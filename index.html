<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Merry Christmas · christmas-tree v17.6</title>
<meta name="description" content="A glowing particle Christmas tree, made for 2026.">
<style>
  :root{
    --gold:#ffd88a;
    --ink:#eaf1ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#04070f;
    overflow:hidden;
    font-family:"Georgia","Times New Roman","Songti SC","STSong",serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block}

  .hud{position:fixed;inset:0;pointer-events:none}

  .top{
    position:absolute;top:max(22px,4vh);left:0;right:0;text-align:center;
  }
  .top .eyebrow{
    font-size:clamp(10px,1.35vw,14px);
    letter-spacing:.42em;
    text-transform:uppercase;
    color:rgba(255,226,170,.72);
    text-shadow:0 0 18px rgba(255,190,90,.35);
  }
  .top h1{
    margin-top:10px;
    font-size:clamp(22px,4.2vw,52px);
    font-weight:400;
    letter-spacing:.18em;
    background:linear-gradient(180deg,#fff8e6 0%,#ffd98d 45%,#e9a94a 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 22px rgba(255,180,80,.35));
  }

  .bottom{
    position:absolute;left:0;right:0;bottom:max(18px,4.2vh);
    display:flex;flex-direction:column;align-items:center;gap:10px;
    text-align:center;
  }
  .count-label{
    font-size:clamp(9px,1.15vw,12px);
    letter-spacing:.34em;text-transform:uppercase;
    color:rgba(210,225,255,.55);
  }
  .count{
    display:flex;gap:clamp(8px,1.6vw,20px);align-items:flex-end;justify-content:center;
  }
  .unit{display:flex;flex-direction:column;align-items:center;min-width:clamp(44px,5vw,72px)}
  .unit b{
    font-family:"Georgia",serif;
    font-variant-numeric:tabular-nums;
    font-size:clamp(20px,3.6vw,44px);
    font-weight:400;line-height:1;
    color:#fff6e3;
    text-shadow:0 0 20px rgba(255,196,110,.65),0 0 48px rgba(255,150,60,.28);
  }
  .unit span{
    margin-top:8px;
    font-size:clamp(9px,1.05vw,11px);
    letter-spacing:.2em;color:rgba(200,218,255,.5);
  }
  .dot{color:rgba(255,214,150,.4);font-size:clamp(16px,2.4vw,28px);line-height:1;padding-bottom:14px}

  .hint{
    margin-top:2px;
    font-size:clamp(9px,1.05vw,11px);
    letter-spacing:.18em;
    color:rgba(190,210,245,.42);
  }

  .fade-bottom{
    position:absolute;left:0;right:0;bottom:0;height:34vh;
    background:linear-gradient(to top,
      rgba(3,7,15,0.96) 0%,
      rgba(3,7,15,0.66) 42%,
      rgba(3,7,15,0.18) 74%,
      rgba(3,7,15,0) 100%);
  }

  .badge{
    position:absolute;top:18px;right:20px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11px;letter-spacing:.12em;
    color:rgba(255,214,150,.55);
    border:1px solid rgba(255,200,120,.22);
    border-radius:999px;padding:5px 11px;
    background:rgba(255,190,90,.05);
    backdrop-filter:blur(6px);
  }
  @media (max-width:520px){
    .top h1{letter-spacing:.1em}
    .badge{top:14px;right:12px;font-size:10px}
    .unit{min-width:38px}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud">
  <div class="top">
    <div class="eyebrow">Merry Christmas</div>
    <h1>Christmas Tree</h1>
  </div>

  <div class="badge">v17.6</div>

  <div class="fade-bottom"></div>

  <div class="bottom">
    <div class="count-label">Countdown to Christmas</div>
    <div class="count" id="count">
      <div class="unit"><b id="d">00</b><span>DAYS</span></div>
      <div class="dot">:</div>
      <div class="unit"><b id="h">00</b><span>HOURS</span></div>
      <div class="dot">:</div>
      <div class="unit"><b id="m">00</b><span>MINS</span></div>
      <div class="dot">:</div>
      <div class="unit"><b id="s">00</b><span>SECS</span></div>
    </div>
    <div class="hint">CLICK THE TREE · PRESS SPACE FOR FIREWORKS</div>
  </div>
</div>

<script>
(function(){
'use strict';

var canvas = document.getElementById('scene');
var ctx = canvas.getContext('2d', { alpha: false });
var W = 0, H = 0, DPR = 1;

/* ---------- palette ---------- */
var PALETTE = [
  [255, 74, 74],
  [255, 192, 96],
  [118, 176, 255],
  [150, 255, 206],
  [255, 246, 232],
  [255, 138, 200]
];

function makeGlow(rgb){
  var S = 64;
  var c = document.createElement('canvas');
  c.width = c.height = S;
  var g = c.getContext('2d');
  var r = rgb[0], gg = rgb[1], b = rgb[2];
  var grad = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  grad.addColorStop(0.00, 'rgba(255,255,255,1)');
  grad.addColorStop(0.16, 'rgba(' + r + ',' + gg + ',' + b + ',0.95)');
  grad.addColorStop(0.42, 'rgba(' + r + ',' + gg + ',' + b + ',0.34)');
  grad.addColorStop(0.72, 'rgba(' + r + ',' + gg + ',' + b + ',0.08)');
  grad.addColorStop(1.00, 'rgba(' + r + ',' + gg + ',' + b + ',0)');
  g.fillStyle = grad;
  g.beginPath();
  g.arc(S/2, S/2, S/2, 0, Math.PI * 2);
  g.fill();
  return c;
}

var SPR = {
  lights: PALETTE.map(makeGlow),
  needle: makeGlow([44, 146, 90]),
  snow:   makeGlow([222, 238, 255]),
  star:   makeGlow([255, 228, 150])
};

/* ---------- state ---------- */
var state = {
  time: 0,
  boost: 0,
  parts: [],
  shake: 0
};

var L = {};
var NEEDLES = [];
var LIGHTS = [];
var SNOW = [];
var STARS = [];
var ORNAMENTS = [];
var ORN_COLORS = [
  ['#ff6a58', '#8d1c15'],
  ['#ffd27a', '#9c6b1d'],
  ['#8ec6ff', '#274d87'],
  ['#f6f9ff', '#95a8c6'],
  ['#ff9ed2', '#932e66']
];
var GIFTS = [
  { ox: -0.385, oy: 0.02, w: 0.30, h: 0.26, c1: '#b8332b', c2: '#7f1e18', rb: '#f7e3bd' },
  { ox: -0.278, oy: 0.14, w: 0.21, h: 0.19, c1: '#1d6b7a', c2: '#124c57', rb: '#f7e3bd' },
  { ox:  0.292, oy: 0.02, w: 0.27, h: 0.24, c1: '#c99239', c2: '#8f681f', rb: '#fdf2d8' },
  { ox:  0.392, oy: 0.14, w: 0.20, h: 0.18, c1: '#3f5f9e', c2: '#2b4272', rb: '#f7e3bd' }
];

function layout(){
  L.cx = W * 0.5;
  L.groundY = H * 0.785;
  L.topY = H * 0.165;
  L.treeH = L.groundY - L.topY;
  L.baseR = Math.min(W * 0.375, L.treeH * 0.55);
  L.scale = Math.max(0.55, Math.min(1.5, L.treeH / 660));
  buildSnow();
  buildStars();
}

function buildTree(){
  NEEDLES.length = 0;
  var i, t, a, rf;
  for (i = 0; i < 2200; i++){
    t = Math.pow(Math.random(), 0.62);
    a = Math.random() * Math.PI * 2;
    rf = 0.48 + 0.52 * Math.pow(Math.random(), 0.45);
    NEEDLES.push({
      t: t, a: a, rf: rf,
      s: 1.3 + Math.random() * 2.6,
      b: 0.55 + Math.random() * 0.85
    });
  }

  LIGHTS.length = 0;
  var N = 118, turns = 7.5, k, tt, aa;
  for (k = 0; k < N; k++){
    tt = 0.02 + 0.965 * (k / (N - 1));
    aa = tt * turns * Math.PI * 2;
    LIGHTS.push({
      t: tt, a: aa, rf: 1.0,
      c: k % PALETTE.length,
      ph: Math.random() * Math.PI * 2,
      sp: 1.1 + Math.random() * 1.7,
      s: 9 + Math.random() * 8
    });
  }
}

function buildOrnaments(){
  ORNAMENTS.length = 0;
  for (var i = 0; i < 18; i++){
    ORNAMENTS.push({
      t: 0.13 + Math.random() * 0.75,
      a: Math.random() * Math.PI * 2,
      rf: 0.82 + Math.random() * 0.17,
      c: i % ORN_COLORS.length,
      r: 4.2 + Math.random() * 4.0
    });
  }
}

function buildSnow(){
  SNOW.length = 0;
  var n = Math.round(Math.min(460, Math.max(120, (W * H) / 3800)));
  for (var i = 0; i < n; i++){
    SNOW.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 0.8 + Math.random() * 2.6,
      sp: 0.25 + Math.random() * 0.85,
      sw: 0.4 + Math.random() * 1.6,
      ph: Math.random() * Math.PI * 2,
      a: 0.25 + Math.random() * 0.6
    });
  }
}

function buildStars(){
  STARS.length = 0;
  var n = Math.round(Math.min(160, Math.max(50, W / 9)));
  for (var i = 0; i < n; i++){
    STARS.push({
      x: Math.random() * W,
      y: Math.random() * (H * 0.62),
      r: 0.3 + Math.random() * 0.9,
      ph: Math.random() * Math.PI * 2,
      sp: 0.4 + Math.random() * 1.4,
      a: 0.16 + Math.random() * 0.42
    });
  }
}

function treeWidthAt(t){
  var base = L.baseR * Math.pow(1 - t, 0.95);
  return base * (1 + 0.085 * Math.sin(t * 7 * Math.PI * 2 - 0.6));
}

function posOf(t, a, rf){
  var y = L.groundY - t * L.treeH;
  var rad = treeWidthAt(t) * rf;
  return {
    x: L.cx + Math.cos(a) * rad,
    y: y,
    z: Math.sin(a),
    rad: rad
  };
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}

/* ---------- countdown ---------- */
function targetDate(){
  var now = new Date();
  var y = now.getFullYear();
  var t = new Date(y, 11, 25, 0, 0, 0, 0);
  if (t.getTime() <= now.getTime()){
    t = new Date(y + 1, 11, 25, 0, 0, 0, 0);
  }
  return t;
}

var elD = document.getElementById('d');
var elH = document.getElementById('h');
var elM = document.getElementById('m');
var elS = document.getElementById('s');

function pad(n){ return (n < 10 ? '0' : '') + n; }

function tick(){
  var diff = targetDate().getTime() - Date.now();
  if (diff < 0) diff = 0;
  var totalSec = Math.floor(diff / 1000);
  var d = Math.floor(totalSec / 86400);
  var h = Math.floor((totalSec % 86400) / 3600);
  var m = Math.floor((totalSec % 3600) / 60);
  var s = totalSec % 60;
  elD.textContent = pad(d);
  elH.textContent = pad(h);
  elM.textContent = pad(m);
  elS.textContent = pad(s);
}

/* ---------- drawing ---------- */
var skyGrad = null, haloGrad = null, vigGrad = null, groundGrad = null;

function buildGradients(){
  skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0.00, '#03060e');
  skyGrad.addColorStop(0.42, '#061127');
  skyGrad.addColorStop(0.76, '#0a1a31');
  skyGrad.addColorStop(1.00, '#04080f');

  haloGrad = ctx.createRadialGradient(
    L.cx, L.groundY * 0.58, 0,
    L.cx, L.groundY * 0.58, Math.max(W, H) * 0.65
  );
  haloGrad.addColorStop(0, 'rgba(52,132,96,0.20)');
  haloGrad.addColorStop(0.40, 'rgba(28,74,120,0.10)');
  haloGrad.addColorStop(1, 'rgba(0,0,0,0)');

  groundGrad = ctx.createLinearGradient(0, L.groundY - 40, 0, H);
  groundGrad.addColorStop(0, 'rgba(198,222,250,0.50)');
  groundGrad.addColorStop(0.32, 'rgba(148,180,222,0.26)');
  groundGrad.addColorStop(1, 'rgba(8,18,34,0)');

  vigGrad = ctx.createRadialGradient(
    W * 0.5, H * 0.52, Math.min(W, H) * 0.22,
    W * 0.5, H * 0.52, Math.max(W, H) * 0.78
  );
  vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
  vigGrad.addColorStop(1, 'rgba(0,0,0,0.52)');
}

function drawSky(){
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = haloGrad;
  ctx.fillRect(0, 0, W, H);
}

function drawStars(){
  var t = state.time;
  ctx.fillStyle = '#e2ecff';
  for (var i = 0; i < STARS.length; i++){
    var s = STARS[i];
    ctx.globalAlpha = s.a * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawHills(){
  var gy = L.groundY;
  var hh = H * 0.075;
  ctx.fillStyle = 'rgba(88,120,164,0.13)';
  ctx.beginPath();
  ctx.moveTo(-10, H);
  for (var x = -10; x <= W + 10; x += 14){
    var y = gy - hh - Math.sin(x / (W + 1) * Math.PI * 3.2 + 0.9) * hh * 0.55
                   - Math.sin(x / (W + 1) * Math.PI * 1.3) * hh * 0.35;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W + 10, H);
  ctx.closePath();
  ctx.fill();
}

function drawGround(){
  ctx.fillStyle = groundGrad;
  ctx.beginPath();
  ctx.moveTo(-10, H + 10);
  for (var x = -10; x <= W + 10; x += 10){
    var y = L.groundY
          + Math.sin(x / (W + 1) * Math.PI * 2.4 + 0.4) * 6
          + Math.sin(x / (W + 1) * Math.PI * 5.6) * 3;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W + 10, H + 10);
  ctx.closePath();
  ctx.fill();
}

function drawSnowMound(){
  var x = L.cx;
  var y = L.groundY + L.baseR * 0.05;
  var rx = L.baseR * 1.22;
  var ry = L.baseR * 0.21;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(rx, ry);
  var g = ctx.createRadialGradient(0, -0.35, 0, 0, 0, 1);
  g.addColorStop(0, 'rgba(226,240,255,0.42)');
  g.addColorStop(0.65, 'rgba(190,214,245,0.14)');
  g.addColorStop(1, 'rgba(190,214,245,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, 1, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawGift(g){
  var bw = g.w * L.baseR;
  var bh = g.h * L.baseR;
  var x = L.cx + g.ox * W;
  var y = L.groundY + g.oy * L.baseR + bh * 0.42;

  ctx.fillStyle = 'rgba(3,8,16,0.42)';
  ctx.beginPath();
  ctx.ellipse(x, y + bh * 0.52, bw * 0.66, bh * 0.16, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = g.c1;
  ctx.fillRect(x - bw / 2, y - bh / 2, bw, bh);

  var sh = ctx.createLinearGradient(x - bw / 2, 0, x + bw / 2, 0);
  sh.addColorStop(0, 'rgba(255,255,255,0.16)');
  sh.addColorStop(0.5, 'rgba(0,0,0,0)');
  sh.addColorStop(1, 'rgba(0,0,0,0.46)');
  ctx.fillStyle = sh;
  ctx.fillRect(x - bw / 2, y - bh / 2, bw, bh);

  ctx.fillStyle = g.rb;
  ctx.globalAlpha = 0.92;
  ctx.fillRect(x - bw * 0.055, y - bh / 2, bw * 0.11, bh);
  ctx.fillRect(x - bw / 2, y - bh * 0.055, bw, bh * 0.11);
  ctx.globalAlpha = 1;

  ctx.strokeStyle = g.rb;
  ctx.lineWidth = Math.max(1.5, bw * 0.045);
  ctx.beginPath();
  ctx.ellipse(x - bw * 0.14, y - bh * 0.58, bw * 0.14, bh * 0.10, -0.5, 0, Math.PI * 2);
  ctx.moveTo(x + bw * 0.14, y - bh * 0.58);
  ctx.ellipse(x + bw * 0.14, y - bh * 0.58, bw * 0.14, bh * 0.10, 0.5, 0, Math.PI * 2);
  ctx.stroke();
}

function drawTreeBody(){
  var cx = L.cx;
  var N = 96, i, t, y, x;
  var w = L.baseR * 1.02;

  var g = ctx.createLinearGradient(cx - w, 0, cx + w, 0);
  g.addColorStop(0.00, 'rgba(10,46,32,0)');
  g.addColorStop(0.20, 'rgba(12,56,38,0.28)');
  g.addColorStop(0.50, 'rgba(22,92,60,0.52)');
  g.addColorStop(0.80, 'rgba(12,56,38,0.28)');
  g.addColorStop(1.00, 'rgba(10,46,32,0)');
  ctx.fillStyle = g;

  ctx.beginPath();
  ctx.moveTo(cx, L.topY);
  for (i = 1; i <= N; i++){
    t = 1 - i / N;
    y = L.groundY - t * L.treeH;
    x = cx + treeWidthAt(t) * 1.02;
    ctx.lineTo(x, y);
  }
  ctx.quadraticCurveTo(cx + L.baseR * 0.35, L.groundY + L.baseR * 0.11, cx, L.groundY + L.baseR * 0.07);
  ctx.quadraticCurveTo(cx - L.baseR * 0.35, L.groundY + L.baseR * 0.11, cx - L.baseR * 1.02, L.groundY);
  for (i = N; i >= 1; i--){
    t = 1 - i / N;
    y = L.groundY - t * L.treeH;
    x = cx - treeWidthAt(t) * 1.02;
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
}

function drawNeedles(){
  for (var i = 0; i < NEEDLES.length; i++){
    var p = NEEDLES[i];
    var q = posOf(p.t, p.a, p.rf);
    var front = (q.z + 1) * 0.5;
    var size = p.s * L.scale * (1.1 + 0.9 * front);
    ctx.globalAlpha = (0.07 + 0.26 * p.b * front) * (0.80 + 0.6 * p.t);
    ctx.drawImage(SPR.needle, q.x - size * 0.5, q.y - size * 0.5, size, size);
  }
  ctx.globalAlpha = 1;
}

function drawLights(){
  var t = state.time, boost = state.boost;
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < LIGHTS.length; i++){
    var l = LIGHTS[i];
    var q = posOf(l.t, l.a, l.rf);
    var tw = 0.5 + 0.5 * Math.sin(t * l.sp + l.ph);
    var front = (q.z + 1) * 0.5;
    var size = l.s * L.scale * (0.8 + 0.6 * tw) * (1 + boost * 0.35);
    var alpha = (0.28 + 0.6 * tw) * (0.5 + 0.5 * front) * (1 + boost * 0.9);
    ctx.globalAlpha = alpha > 1 ? 1 : alpha;
    ctx.drawImage(SPR.lights[l.c], q.x - size * 0.5, q.y - size * 0.5, size, size);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawOrnaments(){
  for (var i = 0; i < ORNAMENTS.length; i++){
    var o = ORNAMENTS[i];
    var q = posOf(o.t, o.a, o.rf);
    var front = (q.z + 1) * 0.5;
    var R = o.r * L.scale * (0.85 + 0.35 * front);
    var c = ORN_COLORS[o.c];

    var g = ctx.createRadialGradient(
      q.x - R * 0.35, q.y - R * 0.40, R * 0.05,
      q.x, q.y, R * 1.05
    );
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.28, c[0]);
    g.addColorStop(0.82, c[1]);
    g.addColorStop(1, 'rgba(4,10,18,0.9)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(q.x, q.y, R, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 0.35 + 0.45 * front;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(q.x - R * 0.34, q.y - R * 0.38, R * 0.17, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawTopStar(){
  var x = L.cx;
  var y = L.topY - L.baseR * 0.06;
  var pulse = 0.9 + 0.1 * Math.sin(state.time * 2.1) + state.boost * 0.35;
  var R = L.baseR * 0.185 * pulse;

  ctx.globalCompositeOperation = 'lighter';
  var gs = R * 4.2;
  ctx.globalAlpha = 0.34 * Math.min(1.4, pulse);
  ctx.drawImage(SPR.star, x - gs * 0.5, y - gs * 0.5, gs, gs);
  ctx.globalAlpha = 1;

  ctx.beginPath();
  for (var i = 0; i < 10; i++){
    var ang = -Math.PI / 2 + i * Math.PI / 5;
    var rr = (i % 2 === 0) ? R : R * 0.42;
    var px = x + Math.cos(ang) * rr;
    var py = y + Math.sin(ang) * rr;
    if (i === 0){ ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,243,205,0.96)';
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}

function updateSnowfall(dt){
  var t = state.time;
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < SNOW.length; i++){
    var s = SNOW[i];
    s.y += s.sp * dt * 42;
    s.x += Math.sin(t * 0.6 + s.ph) * s.sw * dt * 26;
    if (s.y > H + 12){ s.y = -12; s.x = Math.random() * W; }
    if (s.x < -12){ s.x = W + 12; }
    if (s.x > W + 12){ s.x = -12; }
    var size = s.r * 3.4;
    ctx.globalAlpha = s.a;
    ctx.drawImage(SPR.snow, s.x - size * 0.5, s.y - size * 0.5, size, size);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function spawnFirework(x, y){
  var col = PALETTE[Math.floor(Math.random() * PALETTE.length)];
  var n = 40 + Math.floor(Math.random() * 16);
  for (var i = 0; i < n; i++){
    var ang = Math.random() * Math.PI * 2;
    var spd = 50 + Math.random() * 190;
    state.parts.push({
      x: x, y: y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 50,
      life: 1,
      decay: 0.55 + Math.random() * 0.6,
      size: 7 + Math.random() * 12,
      c: Math.floor(Math.random() * PALETTE.length)
    });
  }
  if (state.parts.length > 900){
    state.parts.splice(0, state.parts.length - 900);
  }
}

function updateParts(dt){
  var i, p;
  for (i = state.parts.length - 1; i >= 0; i--){
    p = state.parts[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 240 * dt;
    p.vx *= (1 - 1.6 * dt);
    p.vy *= (1 - 0.55 * dt);
    p.life -= p.decay * dt;
    if (p.life <= 0){ state.parts.splice(i, 1); }
  }
}

function drawParts(){
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < state.parts.length; i++){
    var p = state.parts[i];
    var size = p.size * (0.35 + 0.65 * p.life);
    ctx.globalAlpha = Math.max(0, p.life) * 0.9;
    ctx.drawImage(SPR.lights[p.c], p.x - size * 0.5, p.y - size * 0.5, size, size);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawVignette(){
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);
}

/* ---------- loop ---------- */
var last = performance.now();

function frame(now){
  var dt = (now - last) / 1000;
  last = now;
  if (!isFinite(dt) || dt <= 0){ dt = 1 / 60; }
  if (dt > 0.06){ dt = 0.06; }

  state.time += dt;
  state.boost *= Math.pow(0.12, dt);
  if (state.boost < 0.001){ state.boost = 0; }

  drawSky();
  drawStars();
  drawHills();
  drawGround();
  drawSnowMound();
  for (var i = 0; i < GIFTS.length; i++){ drawGift(GIFTS[i]); }
  drawTreeBody();
  drawNeedles();
  drawLights();
  drawOrnaments();
  drawTopStar();
  updateParts(dt);
  drawParts();
  updateSnowfall(dt);
  drawVignette();

  requestAnimationFrame(frame);
}

/* ---------- interaction ---------- */
function ignite(x, y){
  state.boost = 1;
  spawnFirework(x, y);
}

canvas.addEventListener('pointerdown', function(e){
  ignite(e.clientX, e.clientY);
});

window.addEventListener('keydown', function(e){
  if (e.code === 'Space' || e.key === ' '){
    e.preventDefault();
    ignite(L.cx, L.topY + L.baseR * 0.15);
  }
});

var rzTimer = null;
window.addEventListener('resize', function(){
  if (rzTimer) clearTimeout(rzTimer);
  rzTimer = setTimeout(function(){
    resize();
    buildGradients();
  }, 180);
});

/* ---------- boot ---------- */
buildTree();
buildOrnaments();
resize();
buildGradients();
tick();
setInterval(tick, 500);
requestAnimationFrame(function(now){
  last = now;
  requestAnimationFrame(frame);
});
})();
</script>
</body>
</html>
